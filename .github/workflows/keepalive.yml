name: Keep database awake

# Supabase pauses free projects after about a week with no activity, which would take TaDo offline.
# This sends one tiny request a day so the project never looks idle. The request is anonymous, and
# every row is private to its owner, so it returns nothing; it just wakes the database up.
# (GitHub switches off scheduled workflows in a repo that has had no commits for 60 days; pushing
# any commit, or running this workflow by hand, turns it back on.)

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" > /dev/null
          echo "Database responded."
